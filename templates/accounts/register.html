{% extends "base.html" %}

{% block title %}
Registro | Forum Tech
{% endblock %}

{% block content %}
<h1>Crear una cuenta</h1>

<p>Únete a la comunidad de Forum Tech.</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Registrarse</button>
</form>

<p>
    ¿Ya tienes una cuenta?
    <a href="{% url 'login' %}">Inicia sesión</a>
</p>
{% endblock %}
